<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>류소 옷장 - 아바타</title>
<style>
  :root{--bg:#fdf6f0;--card:#fff;--ink:#3b2f2f;--sub:#9a8a84;--accent:#e58e8e;--line:#f0e2da}
  @media (prefers-color-scheme:dark){:root{--bg:#1e1a1a;--card:#2a2424;--ink:#f3e9e4;--sub:#a99c96;--accent:#e58e8e;--line:#3a3131}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;min-height:100dvh;display:flex;flex-direction:column}
  .tabs{display:flex;position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
  .tabs button{flex:1;padding:14px 0;border:0;background:none;color:var(--sub);font-size:15px;font-weight:700}
  .tabs button.on{color:var(--accent);box-shadow:inset 0 -3px var(--accent)}
  main{flex:1;max-width:560px;width:100%;margin:0 auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:12px}
  .stage{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;height:min(58dvh,520px);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:box-shadow .15s}
  .stage.over{box-shadow:0 0 0 3px var(--accent)}
  .stage img{position:absolute;max-height:92%;max-width:80%;object-fit:contain;transition:opacity .25s,transform .25s;filter:drop-shadow(0 6px 8px rgba(0,0,0,.15))}
  .stage img.out{opacity:0;transform:scale(.96)}
  .name{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-weight:700;font-size:14px}
  .arrow{position:absolute;top:50%;translate:0 -50%;width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);font-size:20px;z-index:2}
  .arrow.l{left:8px}.arrow.r{right:8px}
  .row{display:flex;gap:8px;justify-content:space-between;align-items:center}
  .row h2{margin:0;font-size:14px;color:var(--sub)}
  .ghost{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:12px;font-size:13px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
  .item{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 4px 8px;text-align:center;font-size:11px;touch-action:none;user-select:none}
  .item.on{border-color:var(--accent)}
  .item img{width:100%;height:96px;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
  .ghostdrag{position:fixed;z-index:20;width:80px;pointer-events:none;opacity:.85;translate:-50% -60%}
  .hint{font-size:12px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<nav class="tabs">
  <button disabled style="opacity:.5">👗 옷장</button>
  <button class="on">🧍 아바타</button>
</nav>
<main>
  <section class="stage" id="stage">
    <button class="arrow l" id="prev" aria-label="이전 옷">‹</button>
    <img id="cur" alt="아바타">
    <button class="arrow r" id="next" aria-label="다음 옷">›</button>
    <div class="name" id="name"></div>
  </section>
  <div class="row">
    <h2>옷 고르기 (탭하거나 아바타에게 끌어다 놓기)</h2>
    <button class="ghost" id="reset">기본으로</button>
  </div>
  <section class="grid" id="grid"></section>
  <p class="hint" id="hint"></p>
</main>
<script>
const OUTFITS=[
  ["기본형 가르마","기본형_가르마.png"],
  ["검정 가디건","검정_가디건.png"],
  ["회색 가디건","회색_가디건.png"],
  ["회색 자켓","자켓_회색.png"],
  ["청자켓","청자켓.png"],
  ["트위드 자켓+바지","트위드자켓바지.png"],
  ["남색 셔츠원피스","남색셔츠원피스.png"],
  ["남색 치마","남색치마.png"],
  ["갈색 치마","갈색치마.png"],
  ["청치마","청치마.png"],
  ["회색 치마","회색치마.png"],
  ["버버리","버버리.png"],
  ["베이지 가을","베이지가을.png"]
].map(([n,f])=>({n,src:"avatar/"+encodeURIComponent(f)}));

const $=id=>document.getElementById(id);
let idx=0,cur=$("cur");
try{idx=Math.min(+localStorage.getItem("ryuso.outfit")||0,OUTFITS.length-1)}catch(e){}

function wear(i){
  i=(i+OUTFITS.length)%OUTFITS.length;
  idx=i;
  const o=OUTFITS[i],next=new Image();
  next.alt="아바타";
  next.onload=()=>{
    next.className="out";cur.after(next);
    requestAnimationFrame(()=>{next.className="";cur.className="out";});
    const old=cur;cur=next;cur.id="cur";setTimeout(()=>old.remove(),260);
  };
  next.src=o.src;
  $("name").textContent=o.n;
  document.querySelectorAll(".item").forEach((e,k)=>e.classList.toggle("on",k===i));
  try{localStorage.setItem("ryuso.outfit",i)}catch(e){}
}

OUTFITS.forEach((o,i)=>{
  const d=document.createElement("div");d.className="item";d.dataset.i=i;
  d.innerHTML=`<img src="${o.src}" alt=""><div>${o.n}</div>`;
  $("grid").append(d);
});

// 탭 + 드래그 앤 드롭 (터치/마우스 공통, pointer events)
const stage=$("stage");
let drag=null;
$("grid").addEventListener("pointerdown",e=>{
  const it=e.target.closest(".item");if(!it)return;
  drag={it,i:+it.dataset.i,x:e.clientX,y:e.clientY,moved:false,ghost:null};
  it.setPointerCapture(e.pointerId);
});
$("grid").addEventListener("pointermove",e=>{
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){
    drag.moved=true;
    const g=drag.it.querySelector("img").cloneNode();g.className="ghostdrag";document.body.append(g);drag.ghost=g;
  }
  if(drag.moved){
    drag.ghost.style.left=e.clientX+"px";drag.ghost.style.top=e.clientY+"px";
    const r=stage.getBoundingClientRect();
    stage.classList.toggle("over",e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom);
  }
});
function endDrag(e,cancel){
  if(!drag)return;
  const r=stage.getBoundingClientRect();
  const inside=e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom;
  if(!cancel&&(!drag.moved||inside))wear(drag.i);
  drag.ghost&&drag.ghost.remove();stage.classList.remove("over");drag=null;
}
$("grid").addEventListener("pointerup",e=>endDrag(e,false));
$("grid").addEventListener("pointercancel",e=>endDrag(e,true));

$("prev").onclick=()=>wear(idx-1);
$("next").onclick=()=>wear(idx+1);
$("reset").onclick=()=>wear(0);
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")wear(idx-1);if(e.key==="ArrowRight")wear(idx+1)});

cur.src=OUTFITS[idx].src;$("name").textContent=OUTFITS[idx].n;
document.querySelectorAll(".item")[idx].classList.add("on");
</script>
</body>
</html>
